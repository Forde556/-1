<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>طبيّة | تسجيل الدخول</title>
<meta name="description" content="منصة طبيّة التعليمية — سجّل دخولك للوصول إلى محاضراتك وملازمك">
<meta name="theme-color" content="#14304A">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrap">

  <!-- Language toggle -->
  <button class="lang-pill" id="langToggle">
    <span>🌐</span> <span id="langLabel">العربية</span>
  </button>

  <!-- Hero / Brand -->
  <div class="auth-hero">
    <svg class="mark" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="32" cy="32" r="32" fill="#14304A"/>
      <path d="M18 50 V24 A14 14 0 0 1 46 24 V50 Z" fill="#FBF9F6"/>
      <rect x="6" y="20" width="9" height="32" rx="1.5" fill="#F4A340" transform="rotate(-28 15 52)"/>
      <circle cx="12.5" cy="36" r="1.3" fill="#14304A" transform="rotate(-28 15 52)"/>
      <rect x="49" y="20" width="9" height="32" rx="1.5" fill="#F4A340" transform="rotate(28 49 52)"/>
      <circle cx="55.5" cy="36" r="1.3" fill="#14304A" transform="rotate(28 49 52)"/>
      <path d="M32 27c-2.6 0-4 1.6-6 1.6-2.1 0-3.3-1.3-3.3 2.6 0 5.2 2 11.7 4 11.7 1.6 0 1.7-3.9 2.6-4.2.6-.2 1 0 1.6 0h2c.6 0 1-.2 1.6 0 .9.3 1 4.2 2.6 4.2 2 0 4-6.5 4-11.7 0-3.9-1.2-2.6-3.3-2.6-2 0-3.4-1.6-6-1.6Z" fill="#14304A"/>
    </svg>
    <h1 class="auth-title" data-i18n="welcome">أهلاً بعودتك!</h1>
    <p class="auth-sub" data-i18n="subtitle">سجّل دخولك لمتابعة محاضراتك في طبيّة.</p>
    <div class="student-counter" id="studentCounter">
      <span class="counter-num" id="counterNum">—</span>
      <span class="counter-label" data-i18n="students">طالب مسجّل</span>
    </div>
  </div>

  <!-- Auth Card -->
  <div class="auth-card" id="authCard">

    <!-- Email / Password Form -->
    <form id="emailForm" class="email-form" autocomplete="on" novalidate>
      <div class="form-group" id="nameFields" style="display:none;">
        <label for="fullName" data-i18n="fullName">الاسم الكامل</label>
        <input id="fullName" type="text" placeholder="د. أحمد محمد" autocomplete="name">
      </div>
      <div class="form-group" id="usernameField" style="display:none;">
        <label for="username" data-i18n="username">اسم المستخدم</label>
        <input id="username" type="text" placeholder="ahmad_med" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="emailInput" data-i18n="email">البريد الإلكتروني</label>
        <input id="emailInput" type="email" placeholder="example@email.com" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label for="passwordInput" data-i18n="password">كلمة المرور</label>
        <div class="password-wrap">
          <input id="passwordInput" type="password" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" class="eye-btn" id="eyeBtn" aria-label="إظهار/إخفاء كلمة المرور">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn-primary" id="emailSubmit" data-i18n="login">دخول</button>

      <div class="form-footer">
        <button type="button" class="link-btn" id="toggleMode">ليس لديك حساب؟ أنشئ حساباً جديداً</button>
      </div>
    </form>

    <!-- Divider -->
    <div class="auth-divider">
      <span>أو</span>
    </div>

    <!-- Teacher Register Link -->
    <a href="register-teacher.html" class="teacher-link-btn">
      <span>🎓</span>
      <span data-i18n="joinAsTeacher">انضم كأستاذ</span>
    </a>

  </div>

  <!-- Toast -->
  <div class="toast" id="toast" role="alert" aria-live="assertive"></div>

</div>

<!-- Firebase — ES Module -->
<script type="module" src="js/firebase-client.js"></script>
<script type="module" src="js/i18n.js"></script>
<script type="module" src="js/auth-page.js"></script>
</body>
</html>
