<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>طبيّة | المنصة التعليمية</title>
<meta name="theme-color" content="#14304A">
<link rel="manifest" href="manifest.json">
<script>
  (function(){
    var t = localStorage.getItem('tibbiya-theme') ||
      (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Theme Toggle -->
<button class="theme-toggle-btn" id="themeToggle" style="position:absolute; top:20px; left:20px;" aria-label="تبديل النمط">🌙</button>

<div class="auth-wrap">
  <div class="auth-hero">
    <svg class="mark" viewBox="0 0 64 64" fill="none">
      <circle cx="32" cy="32" r="32" fill="var(--primary)"/>
      <path d="M18 50 V24 A14 14 0 0 1 46 24 V50 Z" fill="var(--bg-main)"/>
      <rect x="6" y="20" width="9" height="32" rx="1.5" fill="var(--accent)" transform="rotate(-28 15 52)"/>
      <rect x="49" y="20" width="9" height="32" rx="1.5" fill="var(--accent)" transform="rotate(28 49 52)"/>
    </svg>
    <h1 class="auth-title">منصة طبيّة 🩺</h1>
    <p class="auth-sub">بوابتك للتعلم الطبي الشامل والمتكامل</p>

    <div class="live-counter">
      <div class="pulse-dot"></div>
      <span id="liveCounterText">يتم حساب الطلاب...</span>
    </div>
  </div>

  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">دخول</button>
      <button class="auth-tab" data-tab="student">حساب طالب</button>
      <button class="auth-tab" data-tab="teacher">انضم كأستاذ</button>
    </div>

    <!-- Login Form -->
    <form id="form-login" class="email-form" novalidate>
      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <input id="lEmail" type="email" placeholder="student@example.com" required>
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <div class="password-wrap">
          <input id="lPass" type="password" placeholder="••••••••" required>
          <button type="button" class="eye-btn" onclick="togglePass('lPass', this)">👁️</button>
        </div>
      </div>
      <button type="submit" class="btn-primary" id="btnLogin">دخول</button>
    </form>

    <!-- Student Register Form -->
    <form id="form-student" class="email-form" style="display:none;" novalidate>
      <div class="form-group">
        <label>الاسم الكامل</label>
        <input id="sName" type="text" placeholder="أحمد محمد" required>
      </div>
      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <input id="sEmail" type="email" placeholder="student@example.com" required>
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <div class="password-wrap">
          <input id="sPass" type="password" placeholder="6 أحرف على الأقل" required>
          <button type="button" class="eye-btn" onclick="togglePass('sPass', this)">👁️</button>
        </div>
      </div>
      <div class="checkbox-wrap">
        <input type="checkbox" id="sTerms" required>
        <label for="sTerms">أوافق على <a href="terms.html" target="_blank">شروط الاستخدام</a></label>
      </div>
      <button type="submit" class="btn-primary" id="btnStudent">إنشاء حساب طالب</button>
    </form>

    <!-- Teacher Register Form -->
    <form id="form-teacher" class="email-form" style="display:none;" novalidate>
      <div class="form-group">
        <label>الاسم الكامل</label>
        <input id="tName" type="text" placeholder="د. سارة أحمد" required>
      </div>
      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <input id="tEmail" type="email" placeholder="doctor@hospital.com" required>
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <div class="password-wrap">
          <input id="tPass" type="password" placeholder="••••••••" required>
          <button type="button" class="eye-btn" onclick="togglePass('tPass', this)">👁️</button>
        </div>
      </div>
      <div class="form-group">
        <label>التخصص</label>
        <input id="tSpecialty" type="text" placeholder="تشريح / كيمياء حيوية ..." required>
      </div>
      <div class="checkbox-wrap">
        <input type="checkbox" id="tTerms" required>
        <label for="tTerms">أوافق على <a href="terms.html" target="_blank">شروط الاستخدام</a></label>
      </div>
      <button type="submit" class="btn-primary" id="btnTeacher">إرسال طلب الانضمام</button>

      <!-- Success Message for Teacher -->
      <div id="teacherSuccess" class="notice-box" style="display:none; margin-top:16px;">
        ✅ تم الإرسال! سيتم إشعار الإدارة بطلبك وسنقوم بتفعيل حسابك قريباً.
      </div>
    </form>

  </div>
</div>

<div class="toast" id="toast" role="alert"></div>

<script>
  function togglePass(id, btn) {
    const el = document.getElementById(id);
    el.type = el.type === "password" ? "text" : "password";
    btn.textContent = el.type === "password" ? "👁️" : "🙈";
  }
</script>
<script type="module" src="js/firebase-client.js"></script>
<script src="js/theme.js"></script>
<script type="module" src="js/auth-page.js"></script>
</body>
</html>
